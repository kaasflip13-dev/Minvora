```html
<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Minvora</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         START MENU
    ========================== -->

    <div id="menu">

        <h1>MINVORA</h1>

        <p>
            Mine • Verzamel • Craft • Explore
        </p>

        <button
            id="startBtn"
            type="button"
            onclick="startGame()"
        >
            START GAME
        </button>

        <p class="controls">
            WASD = lopen<br>
            Muis = kijken<br>
            Klik = hakken / minen
        </p>

    </div>


    <!-- =========================
         GAME
    ========================== -->

    <div
        id="game"
        class="hidden"
    >

        <canvas
            id="gameCanvas"
        ></canvas>


        <!-- Crosshair -->

        <div id="crosshair">
            +
        </div>


        <!-- HUD -->

        <div id="hud">

            <div class="topLeft">

                <h2>
                    MINVORA
                </h2>

                <span id="status">
                    Zoek grondstoffen...
                </span>

            </div>


            <div class="inventory">

                <div>
                    🪵
                    <span id="wood">
                        0
                    </span>
                </div>

                <div>
                    🪨
                    <span id="stone">
                        0
                    </span>
                </div>

                <div>
                    ⛏️
                    <span id="ore">
                        0
                    </span>
                </div>

                <div>
                    💎
                    <span id="crystal">
                        0
                    </span>
                </div>

            </div>

        </div>


        <!-- Hand / tool -->

        <div id="hand">

            <div id="tool">
                ⛏️
            </div>

        </div>


        <!-- Hint -->

        <div id="hint">
            Klik om te minen
        </div>


        <!-- Meldingen -->

        <div id="message"></div>

    </div>


    <!-- JAVASCRIPT -->

    <script src="app.js"></script>


    <!-- Start functie -->
    <script>

        function startGame() {

            const menu =
                document.getElementById("menu");

            const game =
                document.getElementById("game");


            if (!menu || !game) {

                alert(
                    "Er is iets fout met het HTML-bestand."
                );

                return;
            }


            // Menu weg

            menu.style.display = "none";


            // Game zichtbaar

            game.classList.remove("hidden");

            game.style.display = "block";


            // Start de game

            if (
                typeof beginGame === "function"
            ) {

                beginGame();

            } else {

                // Als app.js de functie
                // niet heeft

                if (
                    typeof running !== "undefined"
                ) {
                    running = true;
                }

                if (
                    typeof requestAnimationFrame ===
                    "function"
                ) {

                    if (
                        typeof loop ===
                        "function"
                    ) {

                        requestAnimationFrame(loop);

                    }

                }

            }

        }

    </script>

</body>
</html>
```
