```html
<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minvora</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- START MENU -->
    <div id="menu">
        <h1>MINVORA</h1>
        <p>Mine • Verzamel • Craft • Explore</p>

        <button id="startBtn" type="button">
            START GAME
        </button>

        <p class="controls">
            WASD = lopen • Muis = kijken • Klik = hakken/minen
        </p>
    </div>


    <!-- GAME -->
    <div id="game" class="hidden">

        <canvas id="gameCanvas"></canvas>

        <!-- CROSSHAIR -->
        <div id="crosshair">
            +
        </div>

        <!-- HUD -->
        <div id="hud">

            <div class="topLeft">
                <h2>MINVORA</h2>
                <span id="status">
                    Zoek grondstoffen...
                </span>
            </div>

            <div class="inventory">

                <div>
                    🪵
                    <span id="wood">0</span>
                </div>

                <div>
                    🪨
                    <span id="stone">0</span>
                </div>

                <div>
                    ⛏️
                    <span id="ore">0</span>
                </div>

                <div>
                    💎
                    <span id="crystal">0</span>
                </div>

            </div>

        </div>


        <!-- HAND -->
        <div id="hand">
            <div id="tool">
                ⛏️
            </div>
        </div>


        <!-- HINT -->
        <div id="hint">
            Klik om te minen
        </div>


        <!-- MESSAGE -->
        <div id="message"></div>

    </div>


    <script src="app.js"></script>

</body>
</html>
```
