<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Minvora</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- START MENU -->
    <div id="menu">

        <div class="logo">MINVORA</div>

        <div class="subtitle">
            SURVIVAL • MINING • CRAFTING
        </div>

        <button id="startButton">
            START GAME
        </button>

        <div class="menuText">
            WASD om te bewegen<br>
            Klik op grondstoffen om ze te verzamelen<br>
            E opent crafting
        </div>

    </div>


    <!-- GAME -->
    <div id="game">

        <canvas id="gameCanvas"></canvas>


        <!-- HUD -->
        <div id="hud">

            <div id="healthBox">
                <div class="hudTitle">
                    GEZONDHEID
                </div>

                <div class="healthBar">
                    <div id="health"></div>
                </div>

                <div id="healthText">
                    100 / 100
                </div>
            </div>


            <div id="inventory">

                <div class="item">
                    🪵
                    <span id="wood">0</span>
                </div>

                <div class="item">
                    🪨
                    <span id="stone">0</span>
                </div>

                <div class="item">
                    ⛏️
                    <span id="ore">0</span>
                </div>

                <div class="item">
                    💎
                    <span id="crystal">0</span>
                </div>

                <div class="item">
                    🧱
                    <span id="block">0</span>
                </div>

            </div>

        </div>


        <!-- INFO -->
        <div id="info">
            WASD = bewegen<br>
            Klik = verzamelen<br>
            E = crafting
        </div>


        <!-- MESSAGE -->
        <div id="message"></div>


        <!-- CRAFTING -->
        <div id="crafting">

            <h2>CRAFTING</h2>

            <p>
                Maak nieuwe spullen.
            </p>


            <button class="craftButton" data-craft="axe">

                🪓 BIJL

                <small>
                    8 hout + 4 steen
                </small>

            </button>


            <button class="craftButton" data-craft="pickaxe">

                ⛏️ PIKHOUWEEL

                <small>
                    10 steen + 5 erts
                </small>

            </button>


            <button class="craftButton" data-craft="lantern">

                🏮 LANTAARN

                <small>
                    5 hout + 2 erts
                </small>

            </button>


            <button class="craftButton" data-craft="block">

                🧱 BOUWBLOK

                <small>
                    5 hout + 5 steen
                </small>

            </button>

        </div>


        <!-- GAME OVER -->
        <div id="gameOver">

            <h1>GAME OVER</h1>

            <button id="restartButton">
                OPNIEUW
            </button>

        </div>

    </div>


    <script src="app.js"></script>

</body>
</html>
